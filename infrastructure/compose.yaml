services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: bartech
      POSTGRES_PASSWORD: bartech_local
      POSTGRES_DB: indiebar
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bartech -d indiebar"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    environment:
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "1800"
      FRESHCLAM_CHECKS: "1"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20m

volumes:
  postgres-data:
  redis-data:
  clamav-data:
