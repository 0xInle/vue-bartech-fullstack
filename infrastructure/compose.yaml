services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: bartech
      POSTGRES_PASSWORD: bartech_local
      POSTGRES_DB: indiebar
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bartech -d indiebar"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage:
    image: ghcr.io/seaweedfs/minio-compat:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Укажите S3_ACCESS_KEY в .env.local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Укажите S3_SECRET_KEY в .env.local}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  object-storage-init:
    image: amazon/aws-cli:2.36.44
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://object-storage:9000 s3api head-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1
        || aws --endpoint-url http://object-storage:9000 s3api create-bucket --bucket "$${S3_BUCKET}"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Укажите S3_ACCESS_KEY в .env.local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Укажите S3_SECRET_KEY в .env.local}
      AWS_DEFAULT_REGION: ${S3_REGION:-ru-central1}
      S3_BUCKET: ${S3_BUCKET:?Укажите S3_BUCKET в .env.local}
    depends_on:
      object-storage:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8025/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    environment:
      CLAMAV_NO_MILTERD: "true"
      CLAMD_STARTUP_TIMEOUT: "1800"
      FRESHCLAM_CHECKS: "1"
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20m

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  clamav-data:
