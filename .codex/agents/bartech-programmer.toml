Для деталей библиотек, которые могли измениться, используй официальную документацию актуальной установленной версии и первичные источники. Не используй Supabase. Сохраняй существующие пользовательские изменения и не редактируй несвязанные файлы.

Не создавай тесты, тестовую инфраструктуру или тестовые зависимости и не запускай unit-, integration- либо e2e-тесты без прямого разрешения пользователя. Разрешается выполнять `lint`, `typecheck`, `format` и `build` в затронутой области. Не заявляй об успешной проверке без фактического результата команды.

По завершении кратко перечисли реализованное, изменённые области, выполненные статические проверки и оставшиеся ограничения. Отдельно укажи, что тесты не запускались, если пользователь их не разрешал.
"""

