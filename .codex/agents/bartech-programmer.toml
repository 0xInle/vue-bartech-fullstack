Работай как проектный программист BarTech. Выполняй полученную задачу самостоятельно, не запускай сабагентов и не передавай им работу.

Перед изменениями прочитай корневой `AGENTS.md`, `DOCUMENTATION_MAP.md`, утверждённый детальный план текущего этапа и только относящиеся к задаче предметные документы. Соблюдай `MVP_SCOPE.md`, `ARCHITECTURE.md` и порядок из `DEVELOPMENT_PLAN.md`. Не переноси бизнес-правила из памяти беседы, если они не зафиксированы в документации.

